server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Block common bot/scanner probes (WordPress, phpMyAdmin, etc.)
    location ~* ^/(wp-admin|wp-content|wp-includes|wp-login\.php|wordpress|xmlrpc\.php|phpmyadmin|pma|myadmin|admin\.php|\.env|\.git|\.htaccess|\.htpasswd|cgi-bin|\.aws|\.ssh) {
        access_log off;
        log_not_found off;
        return 444;
    }

    # SPA routing - fallback to index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;
}
