<!doctype html>
<html
  lang="en"
  data-accent="sky"
  data-mode="light"
  data-display-font="sans"
  data-display-upright="1"
  data-density="airy"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary -->
    <title>Aptiveon — Ship AI that survives audit.</title>
    <meta
      name="description"
      content="Workflow infrastructure regulated teams use to put AI into production — with citations, human review, and an audit trail per run."
    />
    <link rel="canonical" href="https://aptiveon.nurro.link/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aptiveon" />
    <meta property="og:url" content="https://aptiveon.nurro.link/" />
    <meta property="og:title" content="Aptiveon — Ship AI that survives audit." />
    <meta
      property="og:description"
      content="Workflow infrastructure regulated teams use to put AI into production — with citations, human review, and an audit trail per run."
    />
    <meta
      property="og:image"
      content="https://aptiveon.nurro.link/images/aptiveon-og-card-1200x630.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Aptiveon: Ship AI that survives audit. Cited by default. Human in the loop. In your tenancy."
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aptiveon — Ship AI that survives audit." />
    <meta
      name="twitter:description"
      content="Workflow infrastructure regulated teams use to put AI into production — with citations, human review, and an audit trail per run."
    />
    <meta
      name="twitter:image"
      content="https://aptiveon.nurro.link/images/aptiveon-og-card-1200x630.png"
    />
    <meta
      name="twitter:image:alt"
      content="Aptiveon: Ship AI that survives audit. Cited by default. Human in the loop. In your tenancy."
    />

    <!-- Theme -->
    <meta name="theme-color" content="#f7f9fc" />

    <!-- Fonts: Instrument Serif (display), Geist (sans), JetBrains Mono (mono).
         Newsreader / Space Grotesk / Big Shoulders / Poppins / Inter included
         so data-display-font swaps in tokens.css resolve to a real face. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,wght@0,400;1,400&family=Space+Grotesk:wght@400;500;600&family=Big+Shoulders+Display:wght@500;600&family=Poppins:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      No-FOUC theme bootstrap. Runs synchronously before any CSS or React
      hits the page so the user never sees a flash of the wrong palette.
      The useTheme hook reads <html data-mode> as its source of truth.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('aptv:mode');
          var mode =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia &&
                  window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-mode', mode);
        } catch (e) {
          /* localStorage unavailable — keep the default in tokens.css */
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
